   // no-cors sends the request, but cannot prove successful storage.
   await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:params,redirect:'follow'});
   setStatus('Submission requested. Thank you! Delivery will be checked in the event response sheet.','ok');
   $('copy').textContent='Submitted ✓';
   setTimeout(()=>{closeSheet();$('copy').textContent='Send response';$('copy').disabled=false},1100);
 }catch(err){
   setStatus('Could not send. Please check your connection and try again.','error');
   $('copy').disabled=false;
 }
};
render();
</script></body></html>
